name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# A second push should cancel the first: nothing here is worth queueing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install
        run: pip install -r requirements/dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build required offline assets
        run: npm ci --ignore-scripts && npm run build

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # No network, no database, no Docker: those markers are excluded so a
      # green CI means the offline suite is green, not that something was
      # skipped quietly.
      - name: Test
        run: pytest -q -m "not network and not docker"

  javascript:
    name: navigation and browser logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build local browser dependencies
        run: npm ci --ignore-scripts && npm run build

      - name: Verify offline dependency graph
        run: node scripts/check_offline_assets.mjs
      - name: Test
        run: node --test "tests/js/*.test.mjs"

  generated:
    name: generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install
        run: pip install -r requirements/dev.txt

      # The map style and the sprite sheet are generated from the taxonomy. A
      # category added without regenerating them draws nothing on the map, and
      # nobody notices until a user does.
      - name: Map style
        run: python3 scripts/build_style.py --check

      - name: Sprite coverage
        run: python3 scripts/build_sprites.py --check

  data:
    name: curated data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install
        run: pip install -r requirements/dev.txt

      # Each file is validated by the repository's own loader, so the check
      # cannot drift from how the code actually reads it. Missing data fails.
      - name: Validate
        run: python3 scripts/validate_data.py

  moderation:
    name: schema and corrections (PostGIS ${{ matrix.postgis }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgis: ["16-3.4", "17-3.5"]
    services:
      postgis:
        image: postgis/postgis:${{ matrix.postgis }}
        env:
          POSTGRES_DB: nicanav_test
          POSTGRES_USER: nicanav
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nicanav -d nicanav_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements/dev.txt
      - name: Test schema installation, maintenance and correction transactions
        env:
          NICANAV_TEST_DSN: postgresql://nicanav:test-only-password@localhost:5432/nicanav_test
        run: pytest -q -m docker tests/test_moderation_postgis.py

  browser:
    name: mobile journeys (Chromium and WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci --ignore-scripts && npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-browser-results
          path: test-results/
          retention-days: 14

  deployment:
    name: release proxy and nginx configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements/dev.txt
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Real proxy generation and byte-range forwarding
        run: pytest -q -m docker tests/test_release_gateway.py
      - name: Container nginx syntax
        run: docker run --rm --add-host api:127.0.0.1 -v "$PWD/infra/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t
