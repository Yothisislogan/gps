# nicanav edge config.
#
# Three jobs: serve the PWA, serve PMTiles archives with working HTTP byte
# ranges, and reverse-proxy the API.
#
# The PMTiles rules below are not stylistic. With gzip covering the archive's
# MIME type, nginx does not merely skip compression — it discards the Range
# header, answers 200 with the entire archive, chunked, with no Content-Length
# and a weakened ETag. pmtiles.js then throws "Server returned no content-length
# header or content-length exceeding request", which reads like a client bug and
# is not. Everything in the /tiles/ location exists to prevent that.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # nginx ships no MIME mapping for .pmtiles; declaring it makes the gzip
    # rules below predictable instead of dependent on default_type. Only the
    # extensions mime.types does not already carry are listed — re-declaring
    # one it knows (json, woff2) logs a duplicate-extension warning on every
    # start, which teaches people to ignore the log.
    types {
        application/octet-stream pmtiles;
        application/json         geojson;
        application/x-protobuf   pbf;
    }

    log_format main '$remote_addr - $status $request_time "$request" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    # Compression for text assets only. PMTiles is excluded by MIME type here
    # and by an explicit `gzip off` in its location.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/geo+json image/svg+xml;

    # Coarse protection in front of the API's own per-client limiter.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=writes:10m rate=1r/s;

    server {
        listen 80;
        server_name _;
        client_max_body_size 8m;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ---------------------------------------------------------------- #
        # PMTiles: byte-range served static archives
        # ---------------------------------------------------------------- #
        location /tiles/ {
            alias /srv/tiles/;

            # THE critical line. See the header comment.
            gzip off;

            # nginx emits Accept-Ranges itself for static files; what it will not
            # do is expose ETag cross-origin. pmtiles.js detects a rebuilt
            # archive by comparing ETags (it deliberately does not send
            # If-Match), and it discards weak ones — so the ETag must reach the
            # browser strong and readable, or clients silently serve tiles from
            # two different builds stitched together.
            #
            # add_header in a location REPLACES inherited add_header directives,
            # so the full set is repeated here rather than inherited. `always`
            # keeps them on 412/416/404, where a browser otherwise sees an
            # opaque failure.
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, If-Match" always;
            add_header Access-Control-Expose-Headers "ETag, Content-Length, Content-Range, Accept-Ranges" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header X-Content-Type-Options nosniff always;

            # A rebuilt archive keeps the same URL, so caching is validated
            # rather than immutable: the ETag decides.
            add_header Cache-Control "public, max-age=300, must-revalidate" always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            # A directory listing of the tile store is nobody's business.
            autoindex off;
        }

        # ---------------------------------------------------------------- #
        # API
        # ---------------------------------------------------------------- #
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # The API hashes this for rate limiting; it is never stored raw.
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # Submissions are cheap to send and expensive to moderate.
        location ~ ^/api/(report|alias|poi/suggest)$ {
            limit_req zone=writes burst=5 nodelay;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Basic auth belongs at the edge so the moderation UI is never reachable
        # without it, whatever the app does.
        location /admin {
            auth_basic "nicanav";
            auth_basic_user_file /etc/nginx/admin.htpasswd;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # ---------------------------------------------------------------- #
        # The PWA
        # ---------------------------------------------------------------- #
        # The service worker must never be served stale, or a broken release
        # cannot be replaced remotely.
        location = /sw.js {
            root /srv/web;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires -1;
        }

        # Deployment writes this file; it carries API and tile URLs, so it is
        # revalidated rather than cached hard.
        location = /config.js {
            root /srv/web;
            add_header Cache-Control "no-cache" always;
        }

        location /fonts/ {
            root /srv/web;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        location / {
            root /srv/web;
            index index.html;
            # Deep links like /@12.1415,-86.1682,16z are client-side routes.
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, max-age=600" always;
        }
    }
}
