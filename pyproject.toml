[project]
name = "nicanav"
version = "0.1.0"
description = "Open-source map, search and turn-by-turn navigation for Nicaragua"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Runtime dependencies are pinned in requirements/*.txt so the Docker images and
# the pipeline can install exactly what they need without pulling the whole stack.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "pipeline", "api"]

[tool.pytest.ini_options]
minversion = "8.0"
# Repo root on sys.path so `common`, `pipeline` and `api` import without installing.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "network: test needs outbound network (skipped by default in CI)",
  "docker: test needs a running docker service (valhalla/postgis/meili)",
  "slow: test takes more than a couple of seconds",
]
filterwarnings = ["error::DeprecationWarning:common.*", "error::DeprecationWarning:pipeline.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", ".venv", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # line length is handled by the formatter
  "RUF001",  # ambiguous unicode: Spanish text is full of them on purpose
  "RUF002",
  "RUF003",
  "B008",    # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
